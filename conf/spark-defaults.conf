# Spark settings for every ShopInsight script.
#
# Spark only reads this file if SPARK_CONF_DIR points at this directory BEFORE
# the JVM starts. Every script does that in its first lines:
#     os.environ["SPARK_CONF_DIR"] = str(REPO / "conf")
# docs/SETUP_SPARK.md section 6 explains why it cannot go anywhere later.
#
# Keep this file short. No tuning before the W41 benchmarks (CLAUDE.md rule 3).

# JVM heap of the driver. In local[*] the driver is also the only executor, so
# this is the whole memory Spark gets.
# - Setting it with SparkSession.builder.config(...) works only when that builder
#   starts the JVM. If a JVM is already running (pyspark shell, a notebook, a
#   session stopped earlier in the same process), it is ignored, and after a
#   stop() getConf() even reports 6g while the heap stays at 1 GB.
# - spark.executor.memory does nothing in local[*]. Do not add it.
# kata.py prints the real heap: 6.0 GiB means this line was read, about 1 GiB
# means it was not.
spark.driver.memory 6g

# Interpret and render timestamps in UTC on every machine, whatever the laptop's
# own clock says. The raw event_time is UTC. Without this, a machine set to
# UTC+7 files the events of 30 Nov 17:00-24:00 UTC under 1 Dec: bronze gets 31
# date directories instead of 30, and four machines disagree. batch_silver.py's
# from_utc_timestamp also assumes a UTC session.
spark.sql.session.timeZone UTC
